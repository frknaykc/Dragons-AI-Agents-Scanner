[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragons-ai-agent-scanner"
version = "0.1.0"
description = "Local-first static security scanner for AI agent artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12"]
dependencies = [
    "click>=8.1,<9",
    "markdown-it-py>=3,<5",
    "PyYAML>=6,<7",
    "textual>=3,<9",
]

[project.urls]
Source = "https://github.com/frknaykc/Dragons-AI-Agents-Scanner"

[project.scripts]
dragonscan = "dragonscan.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]
standalone = ["pyinstaller==6.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dragonscan"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "IDEA.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
