# Local Action example for trusted main only. Do not use `./` from an untrusted PR checkout.
# For fork PR scans, use an independently trusted Action source pinned to an immutable commit.
name: Dragons Security Scan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dragons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./
        with:
          target: .
          fail-on: high
          fail-on-incomplete: 'true'
