# Copy to .github/workflows/dragons.yml in the repository being scanned.
# Replace <commit-with-action> with the immutable commit containing action.yml.
name: Dragons Security Scan
on:
  pull_request:
  push:
permissions:
  contents: read
  security-events: write # Only needed when upload-sarif is true.
jobs:
  dragons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: frknaykc/Dragons-AI-Agents-Scanner@<commit-with-action>
        with:
          fail-on: high
          upload-sarif: 'true'
