name: Inert cross-platform release validation (no publish)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit to build and test
        required: true

permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: validation
          persist-credentials: false
      - name: Require an immutable source reference
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: subject
          persist-credentials: false
      - name: Verify checked-out source
        working-directory: subject
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.7'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Provision reviewed locked dependencies (network allowed only here)
        working-directory: subject
        run: uv sync --locked --python 3.12.12 --group standalone
      - name: Offline package, executable and guarded installed-wheel acceptance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python=subject/.venv/bin/python
          if [ "$RUNNER_OS" = Windows ]; then python=subject/.venv/Scripts/python.exe; fi
          "$python" validation/scripts/release_validation.py --source subject --output "$RUNNER_TEMP/dragons-validation" --commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/dragons-validation/summary.json
            ${{ runner.temp }}/dragons-validation/audit.json
            ${{ runner.temp }}/dragons-validation/tests.xml
            ${{ runner.temp }}/dragons-validation/commands.json
            ${{ runner.temp }}/dragons-validation/command-*.log
            ${{ runner.temp }}/dragons-validation/*.whl
            ${{ runner.temp }}/dragons-validation/*.tar.gz
            ${{ runner.temp }}/dragons-validation/dragonscan-*
          if-no-files-found: error
          retention-days: 7
