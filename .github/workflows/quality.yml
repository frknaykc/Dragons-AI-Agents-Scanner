name: Offline quality and security regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.7'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12.12
      - name: Offline quality and regression gates
        run: |
          uv run --offline pytest -q
          uv run --offline ruff format --check .
          uv run --offline ruff check .
          uv run --offline mypy src
          uv run --offline mypy scripts
          uv run --offline python -m scripts.benchmark benchmarks/corpus/manifest.json --format json > "$RUNNER_TEMP/benchmark.json"
          uv run --offline python -m scripts.benchmark_gate "$RUNNER_TEMP/benchmark.json"
          uv run --offline python -m scripts.benchmark benchmarks/realworld/manifest.json --format terminal
          uv run --offline python -m scripts.benchmark benchmarks/holdout/manifest.json --format terminal
          uv run --offline python -m scripts.semantic_benchmark benchmarks/semantic/corpus/manifest.json --format terminal
