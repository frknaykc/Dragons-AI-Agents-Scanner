name: Detection checkpoint validation (tests only)
on:
  push:
    branches: [dev/detection-accuracy-checkpoint]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Source quality and finding inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact revision
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKPOINT_SHA"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.22'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Provision locked dependencies
        run: uv sync --locked --python 3.12.12
      - name: Offline source quality
        run: |
          uv run --locked --offline ruff format --check .
          uv run --locked --offline ruff check .
          uv run --locked --offline mypy src scripts
          git diff --check
          uv run --locked --offline python -c 'from scripts.benchmark import registry; ids = registry(); print("Finding IDs:", len(ids)); assert len(ids) == 48'
  native-tests:
    name: Native tests (${{ matrix.platform }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            architecture: x86_64
          - runner: windows-2022
            platform: windows-x86_64
            architecture: x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
            architecture: x86_64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact revision
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKPOINT_SHA"
          git rev-parse HEAD
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.22'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Provision locked dependencies
        run: uv sync --locked --python 3.12.12
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          uv run --locked --offline python -c 'import os, platform; arch = platform.machine().lower(); print(platform.system(), arch, platform.python_version()); assert arch in ({"x86_64", "amd64"} if os.environ["EXPECTED_ARCH"] == "x86_64" else {"arm64", "aarch64"})'
      - name: Full offline test suite
        run: uv run --locked --offline pytest -q -rs
  strict-accuracy:
    name: Strict accuracy (${{ matrix.suite }}, known disagreement)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [phase6-v2, corpus]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact revision
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKPOINT_SHA"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.22'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Provision locked dependencies
        run: uv sync --locked --python 3.12.12
      # These gates deliberately retain their nonzero status. Test/quality jobs
      # are independent evidence, not a waiver or replacement accuracy score.
      - name: Frozen Phase 6 v2 strict evaluator
        if: matrix.suite == 'phase6-v2'
        run: uv run --locked --offline python -m scripts.phase6_evaluation benchmarks/phase6-v2/manifest.json
      - name: Existing corpus strict gate
        if: matrix.suite == 'corpus'
        run: |
          uv run --locked --offline python -m scripts.benchmark benchmarks/corpus/manifest.json --format json > "$RUNNER_TEMP/corpus.json"
          uv run --locked --offline python -m scripts.benchmark_gate "$RUNNER_TEMP/corpus.json"
