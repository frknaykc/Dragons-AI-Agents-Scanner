name: Observe standalone default network behavior (no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-observation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.7'
          python-version: '3.12.12'
          enable-cache: 'false'
      - name: Install locked build dependencies
        run: uv sync --locked --python 3.12.12 --group standalone
      - name: Build native executable
        run: uv run --locked --group standalone python scripts/build_standalone.py
      - name: Observe isolated default scans
        run: uv run --locked --group standalone python -m scripts.verify_network
      - name: Upload sanitized results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: network-observation-${{ matrix.platform }}
          path: network-validation.json
          if-no-files-found: warn
          retention-days: 7
